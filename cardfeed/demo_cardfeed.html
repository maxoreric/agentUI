<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CardFeed Demo</title>
    <style>
        /* CSS Reset & Variables */
        :root {
            --bg-color: #000000;
            --card-width: min(480px, 100vw);
            --card-height: 100vh;
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.7);
            --accent-color: #3b82f6; /* Blue-500 */
            --glass-bg: rgba(20, 20, 20, 0.6);
            --glass-border: rgba(255, 255, 255, 0.1);
            --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            overflow: hidden; /* Prevent body scroll, handle in container */
        }

        /* Feed Container: The Scroll Snap Logic */
        .feed-container {
            height: 100vh;
            width: 100vw;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scroll-behavior: smooth;
        }

        /* Card Unit */
        .card {
            height: 100vh;
            width: 100vw;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to bottom, #0f0f0f, #000000);
            border-bottom: 1px solid #222;
        }

        /* Card Inner Container (Mobile width on desktop) */
        .card-inner {
            width: var(--card-width);
            height: 100%;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #111;
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
        }

        /* 1. Header (Timestamp/Meta) */
        .card-header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-secondary);
            z-index: 10;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(45deg, #3b82f6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            color: white;
        }

        /* 2. Content Area (Flexible, scrollable if long) */
        .card-content {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            /* Hide scrollbar */
            scrollbar-width: none; 
            -ms-overflow-style: none;
            mask-image: linear-gradient(to bottom, transparent, black 20px, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 20px, black 95%, transparent);
        }
        .card-content::-webkit-scrollbar { display: none; }

        /* Typography for Content */
        .card-content h1 { font-size: 1.8rem; margin-bottom: 12px; line-height: 1.2; background: linear-gradient(to right, #fff, #999); -webkit-background-clip: text; -webkit-text-fill-color: transparent;}
        .card-content h2 { font-size: 1.2rem; margin-top: 20px; margin-bottom: 8px; color: #eee; }
        .card-content p { font-size: 1rem; line-height: 1.6; color: #ddd; margin-bottom: 16px; }
        .card-content code { background: #222; padding: 2px 6px; border-radius: 4px; font-family: monospace; color: #f9a8d4; }
        .card-content pre { background: #1a1a1a; padding: 12px; border-radius: 8px; overflow-x: auto; margin: 12px 0; border: 1px solid #333; }

        /* 3. Interaction Area (Fixed Bottom) */
        .card-interactions {
            padding: 24px 20px 40px 20px; /* Extra padding bottom for safe area */
            background: linear-gradient(to top, rgba(0,0,0,1) 0%, rgba(0,0,0,0.9) 60%, rgba(0,0,0,0) 100%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Mock Interactions */
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--text-primary);
            color: black;
        }
        .btn-primary:active { transform: scale(0.98); opacity: 0.9; }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(10px);
        }
        .btn-secondary:active { background: rgba(255, 255, 255, 0.2); }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #fca5a5;
        }
        .btn-danger:active { background: rgba(239, 68, 68, 0.3); }

        /* Choice Grid */
        .choice-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        
        .choice-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 20px 10px;
            border-radius: 12px;
            color: white;
            text-align: left;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            gap: 4px;
            cursor: pointer;
        }
        .choice-btn.selected {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3b82f6;
        }
        .choice-label {
            font-weight: bold;
            font-size: 1.2rem;
            color: var(--accent-color);
        }
        .choice-text {
            font-size: 0.9rem;
            color: #ccc;
        }

        /* Chart Placeholder (Dashboard Card) */
        .chart-placeholder {
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, rgba(59, 130, 246, 0.1) 0%, rgba(0,0,0,0) 100%);
            border-bottom: 2px solid #3b82f6;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
        }
        .chart-bar {
            position: absolute;
            bottom: 0;
            width: 20px;
            background: #3b82f6;
            opacity: 0.7;
            border-radius: 4px 4px 0 0;
        }

        /* Mobile Optimization / Desktop Centering */
        @media (min-width: 481px) {
            body { background-color: #000; }
            .card {
                background: #000; 
                /* Pattern for desktop background */
                background-image: radial-gradient(#222 1px, transparent 1px);
                background-size: 20px 20px;
            }
            .card-inner {
                border-left: 1px solid #222;
                border-right: 1px solid #222;
            }
        }
        
        /* Floating "New" Indicator */
        .new-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(59, 130, 246, 0.9);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            z-index: 100;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            animation: bounce 2s infinite;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .new-indicator.visible { opacity: 1; }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateX(-50%) translateY(0);}
            40% {transform: translateX(-50%) translateY(-6px);}
            60% {transform: translateX(-50%) translateY(-3px);}
        }

    </style>
</head>
<body>

    <div id="new-indicator" class="new-indicator">↑ New Updates</div>

    <div class="feed-container" id="feed">
        <!-- Rendered via JS -->
    </div>

    <script>
        // --- 1. Mock Data (The Hybrid Architecture) ---
        const CARDS = [
            // Card 1: Briefing (Markdown Content)
            {
                id: "c1",
                type: "briefing",
                timestamp: "2 min ago",
                author: "Claude",
                content: {
                    type: "markdown",
                    body: `
                        <h1>🌅 Daily Briefing</h1>
                        <p>Found 3 potential tasks for today based on your backlog analysis.</p>
                        
                        <h2>Priority Items</h2>
                        <p>1. <b>Fix Auth Bug</b>: Users reporting timeouts on login.<br>
                        2. <b>Update Dependencies</b>: React 19 migration pending.<br>
                        3. <b>Review Design</b>: New dashboard mockups ready.</p>
                        
                        <p>System load is normal (42%). No security alerts.</p>
                    `
                },
                interactions: [
                    { type: "button", label: "✅ Acknowledge", action: "ack", variant: "primary" },
                    { type: "button", label: "💬 Comment", action: "comment", variant: "secondary" }
                ]
            },
            
            // Card 2: Choice (Decision Making)
            {
                id: "c2",
                type: "choice",
                timestamp: "5 min ago",
                author: "Claude",
                content: {
                    type: "markdown",
                    body: `
                        <h1>🤔 Architecture Decision</h1>
                        <p>I found two ways to implement the <b>Notification System</b>. Which one do you prefer?</p>
                        <p><b>Option A</b> is simpler but less scalable for millions of users.<br>
                        <b>Option B</b> requires Redis but handles high throughput.</p>
                    `
                },
                interactions: [
                    { 
                        type: "choice_group", 
                        options: [
                            { id: "opt_a", label: "A", text: "Simple Polling (Postgres)" },
                            { id: "opt_b", label: "B", text: "Pub/Sub (Redis)" },
                            { id: "opt_c", label: "C", text: "Explain more..." },
                            { id: "opt_d", label: "D", text: "Let's create RFC" }
                        ]
                    }
                ]
            },

            // Card 3: Code Review (Approval)
            {
                id: "c3",
                type: "code",
                timestamp: "12 min ago",
                author: "Coding Agent",
                content: {
                    type: "markdown", // Simulating code block via HTML here for simplicity
                    body: `
                        <h1>🛠️ Fix: Retry Logic</h1>
                        <p>Added exponential backoff to the API client.</p>
                        <pre><code>async function fetchWithRetry(url) {
  let retries = 3;
  while (retries > 0) {
    try {
      return await fetch(url);
    } catch (err) {
      const waitTime = 2 ** (3 - retries) * 100;
      await sleep(waitTime);
      retries--;
    }
  }
  throw new Error("Failed");
}</code></pre>
                        <p><i>Changes: 1 file modified, +12 lines.</i></p>
                    `
                },
                interactions: [
                    { type: "button", label: "🚀 Approve & Merge", action: "approve", variant: "primary" },
                    { type: "button", label: "🛑 Request Changes", action: "reject", variant: "danger" },
                    { type: "button", label: "🔍 View Diff", action: "diff", variant: "secondary" }
                ]
            },

            // Card 4: Dashboard (Interactive UI)
            {
                id: "c4",
                type: "dashboard",
                timestamp: "1 hour ago",
                author: "Metrics Bot",
                content: {
                    type: "custom",
                    body: `
                        <h1>📊 Performance Spike</h1>
                        <p>Latency increased by 200% in the US-East region.</p>
                        <div class="chart-placeholder" id="demo-chart">
                            <!-- JS generates bars here -->
                        </div>
                    `
                },
                interactions: [
                    { type: "button", label: "Escalate to Team", action: "escalate", variant: "danger" },
                    { type: "button", label: "Ignore (False Alarm)", action: "ignore", variant: "secondary" }
                ]
            }
        ];

        // --- 2. Renderer (The "App") ---
        function renderFeed() {
            const container = document.getElementById('feed');
            
            CARDS.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card';
                cardEl.innerHTML = `
                    <div class="card-inner">
                        <!-- Header -->
                        <div class="card-header">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <div class="avatar">${card.author[0]}</div>
                                <span>${card.author}</span>
                            </div>
                            <span>${card.timestamp}</span>
                        </div>

                        <!-- Content (Flexible) -->
                        <div class="card-content">
                            ${card.content.body}
                        </div>

                        <!-- Interactions (Fixed) -->
                        <div class="card-interactions" id="interactions-${card.id}">
                            <!-- Injected via helper -->
                        </div>
                    </div>
                `;
                
                container.appendChild(cardEl);

                // Render Interactions
                const interactionContainer = document.getElementById(`interactions-${card.id}`);
                card.interactions.forEach(item => {
                    if (item.type === 'button') {
                        const btn = document.createElement('button');
                        btn.className = `btn btn-${item.variant}`;
                        btn.innerHTML = item.label;
                        btn.onclick = () => handleAction(card.id, item.action, btn);
                        interactionContainer.appendChild(btn);
                    } else if (item.type === 'choice_group') {
                        const grid = document.createElement('div');
                        grid.className = 'choice-grid';
                        item.options.forEach(opt => {
                            const optEl = document.createElement('div');
                            optEl.className = 'choice-btn';
                            optEl.innerHTML = `<span class="choice-label">${opt.label}</span><span class="choice-text">${opt.text}</span>`;
                            optEl.onclick = () => {
                                // Toggle selection visuals
                                Array.from(grid.children).forEach(c => c.classList.remove('selected'));
                                optEl.classList.add('selected');
                                handleAction(card.id, 'select_' + opt.id);
                            };
                            grid.appendChild(optEl);
                        });
                        interactionContainer.appendChild(grid);
                    }
                });

                // Special Chart Rendering
                if (card.type === 'dashboard') {
                    renderChart(cardEl.querySelector('.chart-placeholder'));
                }
            });
        }

        // --- 3. Interaction Logic ---
        function handleAction(cardId, action, el) {
            console.log(`Action: ${action} on Card: ${cardId}`);
            
            // Mock visual feedback
            if (el && el.classList.contains('btn')) {
                const originalText = el.innerHTML;
                el.innerHTML = "Processing...";
                el.style.opacity = "0.7";
                
                setTimeout(() => {
                    el.innerHTML = "Done ✓";
                    el.style.background = "#22c55e"; // Success green
                    el.style.color = "white";
                    
                    // Auto scroll to next card after short delay?
                    // setTimeout(() => scrollToNext(), 800);
                }, 600);
            }
        }

        function renderChart(container) {
            // Generate some random bars
            for(let i=0; i<15; i++) {
                const bar = document.createElement('div');
                bar.className = 'chart-bar';
                bar.style.left = (i * 6.5) + '%';
                bar.style.height = Math.floor(Math.random() * 80 + 10) + '%';
                container.appendChild(bar);
            }
        }

        // --- 4. Init ---
        renderFeed();

        // Simulate "New Content" indicator after a few seconds
        setTimeout(() => {
            document.getElementById('new-indicator').classList.add('visible');
        }, 3000);

    </script>
</body>
</html>
